$kind: http-request
method: GET
url: '{{baseUrl}}/api/users/profile/'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code !== 200) {
        return;
      }

      const json = pm.response.json();

      pm.test("Profile response is a JSON object", function () {
        pm.expect(json).to.be.an("object");
      });

      pm.test("Profile contains a user identifier", function () {
        pm.expect(json).to.satisfy(function (body) {
          return body.username || body.email || body.id;
        });
      });
