$kind: http-request
method: PATCH
url: '{{baseUrl}}/api/users/profile/'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "favorite_genres": [28, 12],
      "country_code": "UG"
    }
